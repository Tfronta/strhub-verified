# STRspy v2.0 through the issues its first user opened.
#
# A history check: the same tool at the commits that bracket a reported bug,
# and what each one should do according to the issue. The check runs each
# commit through the engine and holds the result to the expectation; where
# they disagree, either the expectation was wrong or the engine misses what
# the user found, and both are worth knowing. docs/PLAN-Version-History.md,
# tanda 4.
#
# The sources are unique379r/strspy#12 (2026-03-24, four bugs), the fix in
# Tfronta's PR #13 (never merged), unique379r/strspy#14 (2026-04-21, five bugs
# with the fork that fixes them), and the author's commits of 2026-04-06 and
# 2026-05-04 on branch STRspy2.0. Bug 5 (BuildDB writes `D10S1248mod.fa` and
# STRspy looks for `D10S1248.fa`) was still open on 2026-05-04.
#
# What the first run found (2026-09-18) is written into the cases below,
# where it corrected an expectation. The short version: bug 1 is open at the
# head of STRspy2.0 — the commit named as its fix changed the file names the
# wrapper checks for, not the directory it checks in.
#
# Two instruments, and they see different bugs. `committed` runs the recipe
# under tools/strspy-ont/ re-pointed at the commit: a curated environment
# that calls src/STRspy_Normal_v2.0_Args.sh directly, so it never touches the
# wrapper (bug 1) and sees the database bugs (2-5) through the run's own
# errors. `proposed` runs what a new user would: the recipe the engine reads
# off the repository at that commit, README command included — which is the
# wrapper. A `proposed` case whose verdict is the tool's publishes, and lands
# in the tool's history as the commit it is.

tool: strspy-ont
repo: https://github.com/unique379r/strspy
cases:
  - ref: e069e19c304720f92587199f66c9e18360e944ef
    label: "v2.0 as first pushed (2026-02-21)"
    run: committed
    because: >-
      No prebuilt database in the repository yet (it arrives 2026-04-06), and
      the one BuildDB would generate has bugs 2-4 (#12). The curated recipe
      unzips db-v2/STRspy2.0-DB.zip, which does not exist here.
    expect:
      verdict: fails
      level: available
      diagnostics: [repo_file_missing]
      no_diagnostics: [base_image_missing]

  - ref: e069e19c304720f92587199f66c9e18360e944ef
    label: "v2.0 as first pushed (2026-02-21), the README's own command"
    run: proposed
    because: >-
      Bug 1 (#12, #14): the wrapper STRspy_run_v2.0_Args.sh checks for the
      v1.1 file names and exits with "please make sure you are in the same
      directory of STRspy" before doing anything.
    expect:
      verdict: fails
      log_contains: "please make sure you are in the same directory"

  - ref: 4ee9f7c2fdbe3accf23a4450894cd24c1a49ab8f
    label: "after the author's reply to #12: prebuilt database added (2026-04-06)"
    run: committed
    because: >-
      The author wrote "all other bugs have been addressed"; #14 (2026-04-21)
      found bugs 1-5 still present. With the prebuilt database the run gets
      further, and bug 5 (mod-suffixed FASTA names) leaves minimap2 without a
      reference for 14 loci, which the run reports as files it cannot open.
    expect:
      verdict: runs
      diagnostics: [cannot_open]

  # The first run of this check (2026-09-18) found the expectation below
  # wrong, and the history right: "Update script to use version 2.0 argument
  # files" changes the names the wrapper checks for (v1.1 -> v2.0) but keeps
  # checking for them in the repository root, and the scripts live in src/.
  # The wrapper still exits on the same line. Bug 1 is not fixed by this
  # commit, nor by the head of STRspy2.0 (dafdee7, the next case); the fix
  # that works is the one in Tfronta's PR #13, which checks src/, unmerged.
  - ref: f7e0897b8283cbf8cdae73c6a22b7b938dc8f377
    label: "'wrapper fixed' (2026-05-04 19:26): the names change, the path does not"
    run: proposed
    because: >-
      The commit the author calls the fix for bug 1. It checks for
      STRspy_Normal_v2.0_Args.sh in the repository root and runs
      src/STRspy_Normal_v2.0_Args.sh; the file is in src/, so the check
      still fails and the wrapper still exits before doing anything.
    expect:
      verdict: fails
      level: installs
      log_contains: "please make sure you are in the same directory"

  - ref: dafdee7e7e5672c8dc732e8577dbe153f53a12f5
    label: "head of STRspy2.0 (2026-05-04 19:47), the README's own command"
    run: proposed
    # The catalogue holds the curated run of this commit (the next case). This
    # run is the same commit through the README's command; published, it would
    # replace that row and the card with "Installs", which is true of the
    # wrapper and not what the curated recipe established. The first run of
    # this check did exactly that, on 2026-09-18, and the curated result had
    # to be re-published.
    publish: false
    because: >-
      Bug 1 as a new user meets it today: the wrapper at the head of the
      branch is the one from f7e0897, and exits on the same line.
    expect:
      verdict: fails
      level: installs
      log_contains: "please make sure you are in the same directory"

  - ref: dafdee7e7e5672c8dc732e8577dbe153f53a12f5
    label: "BuildDB fixes: bugs 2-4 closed, bug 5 open (2026-05-04 19:47)"
    run: committed
    because: >-
      What the catalogue verified on 2026-09-15: runs, writes its counts,
      and reports 18 loci whose alignment it cannot open — bug 5, still open.
    expect:
      verdict: runs
      level: io
      diagnostics: [cannot_open]
