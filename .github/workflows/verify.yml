name: STRhub Verified

# Surface the dispatch id in the run name so the web backend can correlate a
# workflow_dispatch (which returns no run id, §10) back to its run.
#
# A pull request names no tool — the job works that out from what the PR touches
# — so it says which PR instead of a tool it might not be running.
run-name: >-
  ${{ github.event.inputs.mode == 'trial' && 'Trial' || 'Verify' }} ${{ github.event.inputs.tool || (github.event_name == 'pull_request' && format('what PR #{0} changed', github.event.pull_request.number)) || 'strait-razor-PowerSeqv2.31' }}${{ github.event.inputs.dispatch_id && format(' [{0}]', github.event.inputs.dispatch_id) || '' }}

# The engine. Each gate is a CI step; failures are captured (continue-on-error)
# so the report is always produced and reflects the furthest gate cleared.
on:
  workflow_dispatch:
    inputs:
      tool:
        # Free-form so self-service submissions (any slug under tools/) work, not
        # just the maintainer's built-in variants.
        description: "Tool variant to verify (directory under tools/)"
        type: string
        default: "strait-razor-PowerSeqv2.31"
        required: true
      dispatch_id:
        description: "Unique id echoed in run-name for dispatch→run correlation"
        type: string
        required: false
        default: ""
      # A trial is a rehearsal of a recipe that is not committed anywhere: the
      # gates run exactly as for a real verification, but nothing is pushed to
      # main, nothing reaches gh-pages, and the report says "trial" on it. The
      # result lives only in this run's artifact (30 days). This is what lets a
      # submitter try a configuration as often as it takes; every attempt used
      # to be a commit on main and a published attestation.
      mode:
        description: "publish (default) or trial"
        type: choice
        options: [publish, trial]
        default: publish
      recipe:
        description: "Trial only: base64 JSON {manifest_yml, dockerfile, regions_bed?}"
        type: string
        required: false
        default: ""
      # A trial from nothing but a URL: the recipe is PROPOSED here, in CI, from
      # the repository's tree and README (harness/detect_recipe.py), and the
      # report's verdict says whether what could be worked out was enough.
      repo:
        description: "Trial from URL: public GitHub repository (no recipe needed)"
        type: string
        required: false
        default: ""
      ref:
        description: "Trial from URL: commit SHA or tag"
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - "tools/**"
      - "harness/**"
      # The schema every manifest is validated against, and the workflow that
      # does the validating. A change to either can break every tool here, and
      # neither used to run this workflow at all.
      - "schema/**"
      - ".github/workflows/verify.yml"
  schedule:
    - cron: "0 6 1 * *"   # monthly re-verification so badges never go stale

# Permissions are granted per job below, not here. The token is scoped to the
# least each job needs: `resolve` only reads, and only `verify` may write.
permissions: {}

jobs:
  # Which tool(s) this run is about. A dispatch says; a pull request does not,
  # and the answer used to be the default one — so a PR editing a manifest was
  # checked by running an unrelated tool. See harness/pick_tools.py.
  resolve:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read    # reads the files a PR changed
    outputs:
      tools: ${{ steps.pick.outputs.tools }}
      count: ${{ steps.pick.outputs.count }}
      dropped: ${{ steps.pick.outputs.dropped }}
    steps:
      - uses: actions/checkout@v6

      # The harness is what every attestation rests on, so its tests gate every
      # run: a regression in a gate check or a diagnostic rule must stop here,
      # before it can be published as a finding about someone's software.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml jsonschema pytest
      - name: Harness tests
        run: python -m pytest harness/tests -q
      # The BED parser is mirrored in the web form; the shared cases catch the
      # two drifting apart, which otherwise shows up as a run that aborts in
      # pre-flight with no report.
      - name: Shared BED cases
        run: python harness/test_validate_bed.py

      # Before it is trusted to say what this run examines. A picker that quietly
      # went back to answering "the default" would turn every PR green again, and
      # nothing downstream would notice — the whole check would just stop meaning
      # anything, exactly as it did before.
      - name: Check the picker against its own rules
        run: python3 harness/pick_tools.py --selftest

      - id: pick
        name: Pick the tools this run is about
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Empty for pull_request and schedule; only a dispatch sets it.
          INPUT_TOOL: ${{ github.event.inputs.tool }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : > changed.txt
          : > published.json
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename' > changed.txt
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            # What is already published, so the refresh can take the tools whose
            # result is oldest. Best effort: without it the picker falls back to
            # the canary rather than failing the run.
            curl -fsSL -o published.json \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/index.json" \
              || echo "::warning::could not read the published catalogue; refreshing the default only"
          fi
          python3 harness/pick_tools.py \
            --event "$EVENT_NAME" \
            --input-tool "$INPUT_TOOL" \
            --changed changed.txt \
            --published published.json \
            --default "strait-razor-PowerSeqv2.31" \
            >> "$GITHUB_OUTPUT"

      # Only set when the change is a sweep, and then it is the whole list. Said
      # on the run's summary page because that is where a reviewer decides the
      # check means something: a green tick over an unstated gap reads as
      # coverage, and this is the gap.
      - name: Say what was left unverified
        if: steps.pick.outputs.dropped != '[]'
        env:
          DROPPED: ${{ steps.pick.outputs.dropped }}
          RAN: ${{ steps.pick.outputs.tools }}
        run: |
          {
            echo "### Tools this run did NOT verify"
            echo
            echo "This change touches more tools than one run verifies, so it ran the"
            echo "canary \`$RAN\` instead. A green result below is evidence about that"
            echo "tool, and about the harness — not about these:"
            echo
            echo '```json'
            echo "$DROPPED"
            echo '```'
            echo
            echo "Verify any of them with a manual dispatch of this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  # Monthly, alongside the refresh of the stalest published tools: has any
  # verified tool published a release since? If so, the committed recipe is
  # re-run against the new commit as a TRIAL (nothing published) and an issue
  # on this repository says so. See harness/upstream_refresh.py.
  upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write        # dispatches the trials
      issues: write         # one notice, updated rather than duplicated
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml jsonschema
      - name: Find newer upstream releases and dispatch trials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python harness/upstream_refresh.py \
            --index "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/index.json" \
            --dispatch --json upstream_refresh.json
      - name: Say so in an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          r = json.load(open("upstream_refresh.json"))
          if not r.get("dispatched"):
              print("no newer upstream releases"); raise SystemExit(0)
          title = "Upstream releases newer than verified commits"
          body = r["issue_body"]
          existing = subprocess.run(["gh", "issue", "list", "--search", f'"{title}" in:title', "--state", "open",
                                     "--json", "number", "--jq", ".[0].number"], capture_output=True, text=True).stdout.strip()
          if existing:
              subprocess.run(["gh", "issue", "comment", existing, "--body", body], check=True)
          else:
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body, "--label", "upstream"], check=False)
          PY

  verify:
    needs: resolve
    runs-on: ubuntu-22.04   # free, unlimited on public repos
    permissions:
      contents: write        # deploy pushes reports to gh-pages; rejection notices go to main
    strategy:
      # One tool failing its gates says nothing about the next: a matrix leg is a
      # separate attestation, not a stage of one build.
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.resolve.outputs.tools) }}
    env:
      TOOL: ${{ matrix.tool }}
      MODE: ${{ github.event.inputs.mode || 'publish' }}
      # The tool runs as a container built from a submitted Dockerfile with a
      # submitted command. Everything it needs is mounted: inputs, the reference
      # genome, an output directory. So it gets no network (the manifest's
      # `runtime_network` compatibility flag routes tools that need one to manual
      # verification instead), a memory and CPU ceiling, a process cap, and no
      # capabilities. Unquoted on purpose where it is used: it is a flag list.
      DOCKER_HARDENING: >-
        --network none
        --memory 6g --memory-swap 6g
        --cpus 2
        --pids-limit 512
        --cap-drop ALL
        --security-opt no-new-privileges
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true   # fixtures may be stored with Git LFS
          # The token is not left in .git/config. Everything below that writes
          # back (rejection notice, gh-pages, clearing a stale notice) names the
          # remote with the token explicitly, so nothing that runs from this
          # checkout inherits push rights by accident.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml jsonschema reportlab pillow

      # --- Prepare: read manifest, resolve external dataset, stage inputs -----
      # prepare.py stages each matrix leg: work/in_own (BYOR, local or remote)
      # and work/in_external (typed dataset from datasets/, or N/A).
      - id: propose
        name: "Propose a recipe from the repository (trial from URL)"
        if: github.event.inputs.mode == 'trial' && github.event.inputs.recipe == '' && github.event.inputs.repo != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_REPO: ${{ github.event.inputs.repo }}
          TRIAL_REF: ${{ github.event.inputs.ref }}
        run: |
          mkdir -p work
          python harness/detect_recipe.py "$TRIAL_REPO" "$TRIAL_REF" --json recipe_proposal.json
          python harness/propose_manifest.py recipe_proposal.json --slug "$TOOL" \
            --out-dir work/proposal --recipe-b64-out work/recipe.b64

      - id: m
        name: Prepare run (manifest + dataset matrix)
        env:
          # Only set for a trial. Read by prepare.py from the environment rather
          # than the command line: it is author-supplied and can be large.
          RECIPE_B64: ${{ github.event.inputs.mode == 'trial' && github.event.inputs.recipe || '' }}
        run: |
          # A recipe proposed in the step above takes the place of a dispatched one.
          if [ -f work/recipe.b64 ]; then RECIPE_B64="$(cat work/recipe.b64)"; export RECIPE_B64; fi
          python harness/prepare.py "$TOOL" --work work >> "$GITHUB_OUTPUT"

      # --- Pre-flight: the BED the manifest names must actually be here --------
      # STRhub's fault, not the author's, and it must STOP the run.
      #
      # This used to pass silently. The pre-flight below is conditioned on a BED
      # having been staged, so a missing one left it SKIPPED rather than failed;
      # the guard on every reporting step tests for 'failure', so the whole run
      # continued. The tool then ran with no BED, targeted nothing, failed its
      # gates, and was published at `installs` with a diagnostics line telling the
      # author to "check the manifest inputs" — for a file they had uploaded
      # correctly and we had not committed. Failing here is what keeps a fault in
      # our pipeline from being published as a finding about someone's software.
      - id: regions_guard
        name: "Pre-flight · Regions BED staged"
        if: steps.m.outputs.regions_missing == '1'
        env:
          REGIONS_DECLARED: ${{ steps.m.outputs.regions_declared }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python harness/rejection.py \
            --tool "$TOOL" \
            --reason regions_not_staged \
            --detail "$REGIONS_DECLARED" \
            --run-url "$RUN_URL"
          exit 1

      # --- Pre-flight: author-supplied regions BED must fit the slice's panel --
      # NOT a gate. STRhub's reference BAMs are slices; a BED targeting loci the
      # slice doesn't cover would make a healthy tool look broken. So an invalid
      # BED is a REJECTED SUBMISSION: this step has no continue-on-error, so it
      # ABORTS the run — no gates, no report, no badge. Only author-provided BEDs
      # (regions_source == 'tool') are checked; STRhub-committed BEDs are trusted.
      #
      # Every reporting step below is additionally guarded on this step's
      # conclusion: they run `if: always()`, which by itself would survive this
      # abort and emit a red "not run" badge for a tool that never ran.
      # Every manifest-derived value below reaches the shell through `env:`, never
      # through `${{ }}` inside a `run:` block. The manifest is author-supplied, and
      # `${{ }}` is a TEXT substitution performed before bash sees the script: a
      # value containing $(...), a backtick or a quote would run on the RUNNER, which
      # holds a `contents: write` token. Referenced as "$VAR", bash expands the value
      # without re-parsing it, so it stays data. `if:` and `timeout-minutes:` are
      # GitHub expression contexts, not shell, and are safe as they are.
      - id: preflight
        name: "Pre-flight · Regions within panel"
        if: steps.m.outputs.regions_source == 'tool' && steps.m.outputs.supported_loci != ''
        env:
          SUPPORTED_LOCI: ${{ steps.m.outputs.supported_loci }}
          MIN_LOCI: ${{ steps.m.outputs.min_loci || '5' }}
        run: |
          python harness/validate_bed.py \
            --bed work/in_external/regions.bed \
            --supported "$SUPPORTED_LOCI" \
            --min-loci "$MIN_LOCI" \
            --json regions_validation.json

      # The author's counterpart to the guard above: their BED is here, it just
      # does not fit the slice. Same obligation — say what happened and who can
      # fix it — but this one IS actionable by them, and free to correct.
      - name: "Rejection notice · regions outside panel"
        if: always() && steps.preflight.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python harness/rejection.py \
            --tool "$TOOL" \
            --reason regions_outside_panel \
            --validation regions_validation.json \
            --run-url "$RUN_URL"

      # A stopped run publishes no attestation, so the notice is the only thing
      # the submitter can be shown. Commit it on main and always upload it, or
      # the explanation dies with the runner.
      - name: "Publish rejection notice"
        if: always() && (steps.regions_guard.conclusion == 'failure' || steps.preflight.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$MODE" != "trial" ] && [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add "state/rejections/$TOOL.json"
            git commit -m "verified: rejection notice $TOOL" || exit 0
            # Retried like the gh-pages deploy below. A push that loses a race
            # with another run used to end here, and the notice, the only thing
            # a stopped run leaves the submitter, would never exist. The loop
            # used to end in a `sleep` that exits 0, so three lost races still
            # painted this step green; now running out of attempts fails it.
            pushed=0
            for i in 1 2 3; do
              if git push "$remote" HEAD:main; then pushed=1; break; fi
              git pull --rebase "$remote" main || true
              sleep 3
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::could not publish the rejection notice for $TOOL after 3 attempts"
              exit 1
            fi
          fi

      - name: "Upload rejection notice"
        if: always() && (steps.regions_guard.conclusion == 'failure' || steps.preflight.conclusion == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: rejection-${{ env.TOOL }}
          path: state/rejections/

      # --- Reference genome (for BAM-based tools needing --fasta) -------------
      - name: Cache reference genome
        if: steps.m.outputs.ref_genome_url != ''
        uses: actions/cache@v4
        id: ref-cache
        with:
          path: work/ref
          key: ref-${{ steps.m.outputs.ref_genome_filename }}-v1

      - name: Download + index reference genome
        if: steps.m.outputs.ref_genome_url != '' && steps.ref-cache.outputs.cache-hit != 'true'
        env:
          REF_GENOME_URL: ${{ steps.m.outputs.ref_genome_url }}
          REF_GENOME_FILE: ${{ steps.m.outputs.ref_genome_filename }}
        run: |
          mkdir -p work/ref
          echo "::group::Downloading $REF_GENOME_FILE"
          curl -fsSL "$REF_GENOME_URL" | gunzip > "work/ref/$REF_GENOME_FILE"
          echo "::endgroup::"
          echo "::group::Indexing with samtools faidx"
          sudo apt-get install -y -qq samtools >/dev/null 2>&1
          samtools faidx "work/ref/$REF_GENOME_FILE"
          echo "::endgroup::"
          ls -lh work/ref/

      # --- Gate: Available ----------------------------------------------------
      - id: available
        name: "Gate · Available"
        continue-on-error: true
        env:
          TOOL_REPO: ${{ steps.m.outputs.repo }}
        run: git ls-remote "$TOOL_REPO" >/dev/null

      # --- Gate: Installs (docker build) -------------------------------------
      - id: installs
        name: "Gate · Installs"
        continue-on-error: true
        env:
          TOOL_REF: ${{ steps.m.outputs.ref }}
          TOOL_REPO: ${{ steps.m.outputs.repo }}
          DOCKER_DIR: ${{ steps.m.outputs.dockerdir }}
          DOCKER_FILE: ${{ steps.m.outputs.dockerfile }}
          DOCKER_FROM_REPO: ${{ steps.m.outputs.dockerfile_from_repo }}
        run: |
          # pipefail, or `tee` would swallow docker's exit status and a failed
          # build would be recorded as a passed gate — the one bug this step
          # must not have.
          set -o pipefail
          mkdir -p work
          if [ -n "$DOCKER_FROM_REPO" ]; then
            # The repository ships its own Dockerfile: build THAT, with the
            # repository at the pinned ref as its context. The author's own
            # statement of the environment, taken at its word.
            rm -rf work/src
            git clone -q -- "$TOOL_REPO" work/src \
              && git -C work/src checkout -q "$TOOL_REF" \
              && (git -C work/src submodule update --init --recursive -q || true)
            DOCKER_DIR=work/src; DOCKER_FILE="$DOCKER_FROM_REPO"
          fi
          docker build \
            --build-arg "STRAITRAZOR_REF=$TOOL_REF" \
            --build-arg "TOOL_REF=$TOOL_REF" \
            -f "$DOCKER_DIR/$DOCKER_FILE" \
            -t toolimg:ci \
            "$DOCKER_DIR" 2>&1 | tee work/log_build.txt

      # --- Matrix leg: own data (the badge ladder uses THIS leg) -------------
      - id: runs
        name: "Gate · Runs (own data)"
        if: steps.m.outputs.own_ready == '1'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.m.outputs.timeout) }}
        env:
          # The author's own command. It is meant to run INSIDE the container (the
          # image entrypoint is `bash -lc`), so it is passed as a single argument
          # here and never evaluated by the runner's shell.
          # The engine's own images end in `ENTRYPOINT ["/bin/bash", "-lc"]`, so
          # the command is passed as one argument. A repository's own Dockerfile
          # has whatever entrypoint its author chose; for those the entrypoint is
          # overridden to bash so the command still reaches a shell. Unquoted on
          # purpose: empty for the engine's images, two words for a repository's.
          TOOL_CMD: ${{ steps.m.outputs.cmd }}
          ENTRY: ${{ steps.m.outputs.dockerfile_from_repo != '' && '--entrypoint /bin/bash' || '' }}
          ENTRY_ARGS: ${{ steps.m.outputs.dockerfile_from_repo != '' && '-lc' || '' }}
        run: |
          set -o pipefail
          mkdir -p work/out_own
          # World-writable on purpose. The container runs with every capability
          # dropped, so its root has no CAP_DAC_OVERRIDE and cannot write to a
          # directory the runner user owns. Every tool failed with 'Permission
          # denied' on /data/out the first time the hardening ran (PR #19).
          chmod 0777 work/out_own
          REF_MOUNT=""
          [ -d work/ref ] && REF_MOUNT="-v $PWD/work/ref:/data/ref:ro"
          docker run --rm $DOCKER_HARDENING $ENTRY \
            -v "$PWD/work/in_own:/data/in:ro" \
            -v "$PWD/work/out_own:/data/out" \
            $REF_MOUNT \
            toolimg:ci \
            $ENTRY_ARGS "$TOOL_CMD" 2>&1 | tee work/log_own.txt

      - id: io
        name: "Gate · Expected IO (own)"
        if: steps.m.outputs.own_ready == '1'
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
        run: python harness/check_io.py "$MANIFEST" work/out_own --json io_own.json

      - id: content
        name: "Gate · Content (own)"
        if: steps.m.outputs.own_ready == '1'
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
        run: python harness/check_content.py "$MANIFEST" work/out_own --json content_own.json

      # --- Leg: the tool's OWN example (the reviewer's gate) ------------------
      # The README's command on the repository's data, inside the image, with
      # nothing from STRhub. prepare.py wraps it so that everything it creates
      # is copied to /data/out; check_example.py decides whether that is the
      # documented output. Independent of the other legs: a tool whose Quick
      # Start works has earned that sentence even if our reference data did
      # not suit it, and vice versa.
      - id: runs_example
        name: "Reproduces own example"
        if: steps.m.outputs.example_ready == '1'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.m.outputs.timeout) }}
        env:
          EXAMPLE_CMD: ${{ steps.m.outputs.example_cmd }}
          ENTRY: ${{ steps.m.outputs.dockerfile_from_repo != '' && '--entrypoint /bin/bash' || '' }}
          ENTRY_ARGS: ${{ steps.m.outputs.dockerfile_from_repo != '' && '-lc' || '' }}
        run: |
          set -o pipefail
          mkdir -p work/out_example
          # World-writable on purpose. The container runs with every capability
          # dropped, so its root has no CAP_DAC_OVERRIDE and cannot write to a
          # directory the runner user owns. Every tool failed with 'Permission
          # denied' on /data/out the first time the hardening ran (PR #19).
          chmod 0777 work/out_example
          REF_MOUNT=""
          [ -d work/ref ] && REF_MOUNT="-v $PWD/work/ref:/data/ref:ro"
          docker run --rm $DOCKER_HARDENING $ENTRY \
            -v "$PWD/work/out_example:/data/out" \
            $REF_MOUNT \
            toolimg:ci \
            $ENTRY_ARGS "$EXAMPLE_CMD" 2>&1 | tee work/log_example.txt

      - id: example
        name: "Example produced its output"
        if: steps.m.outputs.example_ready == '1'
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
        run: python harness/check_example.py "$MANIFEST" work/out_example --json example.json

      # --- Matrix leg: external typed dataset (N/A if no compatible dataset) --
      - id: runs_ext
        name: "Runs (external data)"
        if: steps.m.outputs.external_ready == '1'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.m.outputs.timeout) }}
        env:
          TOOL_CMD: ${{ steps.m.outputs.cmd }}
          ENTRY: ${{ steps.m.outputs.dockerfile_from_repo != '' && '--entrypoint /bin/bash' || '' }}
          ENTRY_ARGS: ${{ steps.m.outputs.dockerfile_from_repo != '' && '-lc' || '' }}
        run: |
          set -o pipefail
          mkdir -p work/out_external
          # World-writable on purpose. The container runs with every capability
          # dropped, so its root has no CAP_DAC_OVERRIDE and cannot write to a
          # directory the runner user owns. Every tool failed with 'Permission
          # denied' on /data/out the first time the hardening ran (PR #19).
          chmod 0777 work/out_external
          REF_MOUNT=""
          [ -d work/ref ] && REF_MOUNT="-v $PWD/work/ref:/data/ref:ro"
          docker run --rm $DOCKER_HARDENING $ENTRY \
            -v "$PWD/work/in_external:/data/in:ro" \
            -v "$PWD/work/out_external:/data/out" \
            $REF_MOUNT \
            toolimg:ci \
            $ENTRY_ARGS "$TOOL_CMD" 2>&1 | tee work/log_external.txt

      - id: io_ext
        name: "Expected IO (external)"
        if: steps.m.outputs.external_ready == '1'
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
        run: python harness/check_io.py "$MANIFEST" work/out_external --json io_external.json

      - id: content_ext
        name: "Content (external)"
        if: steps.m.outputs.external_ready == '1'
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
        run: python harness/check_content.py "$MANIFEST" work/out_external --json content_external.json

      # --- README minimum-to-run check (advisory; never gates the badge) ------
      - name: "README check (advisory)"
        if: always() && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure'
        continue-on-error: true
        env:
          TOOL_REPO: ${{ steps.m.outputs.repo }}
          TOOL_REF: ${{ steps.m.outputs.ref }}
        run: |
          repo="$TOOL_REPO"; ref="$TOOL_REF"
          slug="${repo#https://github.com/}"; slug="${slug%.git}"
          rm -f readme.md
          for name in README.md readme.md README.MD README.rst README.txt README; do
            if curl -fsSL "https://raw.githubusercontent.com/${slug}/${ref}/${name}" -o readme.md; then break; fi
          done
          [ -f readme.md ] || echo -n > readme.md
          python harness/check_readme.py readme.md --json readme_result.json

      # --- Assemble the matrix (own + external legs) -------------------------
      - name: Assemble matrix
        if: always() && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure'
        env:
          OWN_READY: ${{ steps.m.outputs.own_ready }}
          EXT_READY: ${{ steps.m.outputs.external_ready }}
          EXAMPLE_READY: ${{ steps.m.outputs.example_ready }}
          INPUT_TYPE: ${{ steps.m.outputs.input_type }}
          DATASET_NAME: ${{ steps.m.outputs.dataset_name }}
          FIXTURE_SOURCE: ${{ steps.m.outputs.fixture_source }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          def load(p):
              q = pathlib.Path(p)
              try:
                  return json.loads(q.read_text()) if q.exists() else None
              except Exception:
                  return None
          legs = []
          own_io, own_ct = load("io_own.json"), load("content_own.json")
          fixture_source = os.environ.get("FIXTURE_SOURCE", "strhub")
          own_label = "Your data" if fixture_source == "tool" else "STRhub fixture"
          legs.append({
              "leg": "own", "label": own_label,
              "available": os.environ.get("OWN_READY") == "1",
              "io": bool(own_io and own_io.get("passed")),
              "content": bool(own_ct and own_ct.get("passed")),
              "passed": bool(own_io and own_io.get("passed")),
              "fixture_source": fixture_source,
          })
          ext_io, ext_ct = load("io_external.json"), load("content_external.json")
          legs.append({
              "leg": "external", "label": "External data",
              "available": os.environ.get("EXT_READY") == "1",
              "type": os.environ.get("INPUT_TYPE") or None,
              "dataset": os.environ.get("DATASET_NAME") or None,
              "io": bool(ext_io and ext_io.get("passed")),
              "content": bool(ext_ct and ext_ct.get("passed")),
              "passed": bool(ext_io and ext_io.get("passed")),
          })
          ex = load("example.json")
          legs.append({
              "leg": "example", "label": "Tool's own example",
              "available": os.environ.get("EXAMPLE_READY") == "1",
              "io": bool(ex and ex.get("passed")),
              "content": None,
              "passed": bool(ex and ex.get("passed")),
              "matches_expected": (ex or {}).get("checks", {}).get("matches_expected"),
              "produced_count": (ex or {}).get("produced_count"),
          })
          pathlib.Path("matrix.json").write_text(json.dumps(legs, indent=2))
          print(json.dumps(legs, indent=2))
          PY

      # --- Assemble attestation (always runs) --------------------------------
      - name: Build attestation + badge
        if: always() && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure'
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
          TOOL_REF: ${{ steps.m.outputs.ref }}
          OWN_READY: ${{ steps.m.outputs.own_ready }}
          REGIONS_SOURCE: ${{ steps.m.outputs.regions_source }}
          SUPPORTED_LOCI: ${{ steps.m.outputs.supported_loci }}
          # Step outcomes come from GitHub, not the manifest, so they are a closed
          # vocabulary (success/failure/cancelled/skipped) rather than author input.
          AVAILABLE_OUTCOME: ${{ steps.available.outcome }}
          INSTALLS_OUTCOME: ${{ steps.installs.outcome }}
          RUNS_OUTCOME: ${{ steps.runs.outcome }}
          RUNS_EXT_OUTCOME: ${{ steps.runs_ext.outcome }}
          EXAMPLE_OUTCOME: ${{ steps.runs_example.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read-only, for the upstream check below. Raises the API allowance
          # from 60/hour per runner IP to 5,000, which matters because public
          # runners share addresses.
          GH_TOKEN: ${{ github.token }}
        run: |
          # The badge ladder follows the author's BYOR "own" leg when present;
          # otherwise it rests on the external typed-dataset leg (chosen by
          # inputs.type), which is where the real data ran for form submissions
          # that don't supply a fixture.
          if [ "$OWN_READY" = "1" ]; then
            LADDER_RUNS="$RUNS_OUTCOME"; LADDER_IO=io_own.json; LADDER_CT=content_own.json
          else
            LADDER_RUNS="$RUNS_EXT_OUTCOME"; LADDER_IO=io_external.json; LADDER_CT=content_external.json
          fi
          python harness/report.py \
            --manifest "$MANIFEST" \
            --available "$AVAILABLE_OUTCOME" \
            --installs "$INSTALLS_OUTCOME" \
            --runs "$LADDER_RUNS" \
            --io "$LADDER_IO" \
            --content "$LADDER_CT" \
            --matrix matrix.json \
            --readme readme_result.json \
            --log-own work/log_own.txt \
            --log-external work/log_external.txt \
            --log-build work/log_build.txt \
            --ref "$TOOL_REF" \
            --regions-source "$REGIONS_SOURCE" \
            --regions-validation regions_validation.json \
            --supported-loci "$SUPPORTED_LOCI" \
            --check-upstream \
            --mode "$MODE" \
            --example-runs "$EXAMPLE_OUTCOME" \
            --example example.json \
            --log-example work/log_example.txt \
            --recipe-proposal recipe_proposal.json \
            --run-url "$RUN_URL"

      # The recipe rides with the report so the web can show what ran and, for
      # a trial, let the owner publish exactly that. Only for trials: a
      # published tool's recipe is tools/<slug>/ on main.
      - name: Attach the recipe to the report (trial)
        if: always() && env.MODE == 'trial' && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure'
        env:
          DOCKER_DIR: ${{ steps.m.outputs.dockerdir }}
        run: python harness/attach_recipe.py "$TOOL" --dockerdir "$DOCKER_DIR" --proposal recipe_proposal.json

      - name: Generate PDF report
        if: always() && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure'
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
        run: |
          python harness/generate_pdf.py \
            --manifest "$MANIFEST"

      # Render the human-readable summary on the run's "Summary" page (no download
      # needed). $GITHUB_STEP_SUMMARY accepts Markdown.
      - name: Publish summary to run page
        if: always() && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure'
        run: |
          for f in reports/*.summary.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload attestation
        if: always() && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MODE == 'trial' && 'trial' || 'attestation' }}-${{ env.TOOL }}
          path: reports/
          # A trial's report exists nowhere else, so it is kept the full window a
          # submitter has to come back for it; a published one is on gh-pages.
          retention-days: ${{ env.MODE == 'trial' && 30 || 90 }}

      # Publish a navigable web page (index + per-tool HTML) to the gh-pages
      # branch. Reports accumulate across runs: we clone the existing branch,
      # drop in this run's files, regenerate the index, and push.
      # Publishing is for main only. A dispatch from a test branch must never reach
      # strhub.app/verified — gh-pages IS production. The web backend always
      # dispatches with ref=main (VERIFIED_ENGINE_BRANCH), so real submissions are
      # unaffected; only branch-based testing is held back.
      - id: deploy
        name: Deploy reports to GitHub Pages
        if: always() && env.MODE != 'trial' && steps.preflight.conclusion != 'failure' && steps.regions_guard.conclusion != 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          publish() {
            tmp="$(mktemp -d)"
            if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
              git clone -q --depth 1 --branch gh-pages "$remote" "$tmp"
            else
              git clone -q --depth 1 "$remote" "$tmp"
              git -C "$tmp" checkout -q --orphan gh-pages
              git -C "$tmp" rm -rfq . || true
            fi
            cp -f reports/* "$tmp/" 2>/dev/null || true
            touch "$tmp/.nojekyll"
            python harness/build_index.py "$tmp" --out "$tmp/index.html"
            git -C "$tmp" add -A
            if git -C "$tmp" diff --cached --quiet; then echo "no changes to publish"; return 0; fi
            git -C "$tmp" commit -q -m "deploy ${TOOL} @ run ${{ github.run_id }}"
            git -C "$tmp" push "$remote" gh-pages
          }
          # Matrix legs finish together and every one of them rewrites index.json
          # and index.html, so a plain push races. Each attempt starts from a
          # FRESH clone of the branch, so a lost race is redone on top of the
          # winner's tree instead of rebased over it, and running out of attempts
          # fails the step. The old loop ended in a `sleep` that exits 0, which
          # painted a lost deploy green and left the catalogue silently stale.
          for i in 1 2 3 4 5; do
            if publish; then exit 0; fi
            echo "publish attempt $i failed (most likely a race with another leg); retrying"
            sleep $((i * 3))
          done
          echo "::error::could not publish reports for $TOOL to gh-pages after 5 attempts"
          exit 1

      # An attestation was just published for this tool, so a rejection notice
      # from an earlier, aborted run no longer describes anything. Nothing used
      # to remove it: strsearch-c70179b sat on main as "rejected" for weeks after
      # it had been published at the top step.
      - name: Clear a stale rejection notice
        if: always() && env.MODE != 'trial' && steps.deploy.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -f "state/rejections/$TOOL.json" ] || { echo "no stale notice for $TOOL"; exit 0; }
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q "state/rejections/$TOOL.json"
          git commit -q -m "verified: clear rejection notice for $TOOL (attestation published)"
          for i in 1 2 3; do
            if git push "$remote" HEAD:main; then exit 0; fi
            git pull --rebase "$remote" main || true
            sleep 3
          done
          echo "::warning::could not clear the stale rejection notice for $TOOL; it will be cleared on the next successful run"

      # To publish badges, commit reports/ to a gh-pages branch (or use
      # actions/deploy-pages). strhub.app then fetches reports/<tool>.badge.json
      # as a shields.io endpoint:
      #   https://img.shields.io/endpoint?url=<raw-url-to>/<tool>.badge.json
