# STRhub Verified manifest — generated from a self-service submission.
# Verification metadata only; STRhub stores no tool source code. The
# Dockerfile clones the author's PUBLIC repo at the pinned ref at build time.

tool:
  name: STRaitRazor
  version: v3.0
source:
  repo: "https://github.com/Ahhgust/STRaitRazor"
  ref: b618e9345ab40f348b504083ae8de2b39abb60fa
report:
  slug: "straitrazor-v3-0"
environment:
  dockerfile: Dockerfile
  os: ["ubuntu-22.04"]
run:
  cmd: "/opt/tool/str8rzr -c /opt/tool/ForenSeqv1.27.config /data/in/sample.fastq > /data/out/sample.allsequences.txt"
  timeout_minutes: 14
inputs:
  type: "illumina-str-fastq"
outputs:
- path: "*.allsequences.txt"
  format: "tsv"
  min_records: 1
  # str8rzr allsequences columns: 0=Locus:allele 1="N bases" 2=sequence 3=fwd 4=rev
  content:
    columns: 5
    dna_column: 2
    count_columns: [3, 4]
    locus_column: 0
    locus_sep: ":"
    min_distinct_loci: 50
    min_total_reads: 500
    expect_loci: ["Amelogenin", "CSF1PO", "TH01", "TPOX", "vWA",
                  "D3S1358", "D8S1179", "D18S51", "D21S11", "FGA"]
