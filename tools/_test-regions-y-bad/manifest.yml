# TEST-ONLY manifest — exercises the owner-provided regions BED path on branch
# test/owner-bed. DO NOT MERGE TO main: tools/_test-* are scaffolding, not real tools.
#
# Case "bad": inputs.regions points at a BED in this repo's PUBLIC tree, so
# prepare.py fetches it via raw.githubusercontent and regions_source becomes
# "tool" — which is what triggers the pre-flight panel check.
#   ok  -> BED sits inside the panel  -> pre-flight passes -> gates run
#   bad -> BED includes DYS385a       -> pre-flight FAILS  -> job aborts, no report

tool:
  name: hipstr
  version: v0.7
source:
  repo: "https://github.com/tfwillems/HipSTR"
  ref: b2033bfbb5cf55496b776463bdf2993fa763a4be
report:
  slug: "_test-regions-y-bad"
environment:
  dockerfile: Dockerfile
  os: ["ubuntu-22.04"]
run:
  cmd: "HipSTR --bams /data/in/input.bam --fasta /data/ref/hg38.fa --regions /data/in/regions.bed --str-vcf /data/out/result.vcf.gz --min-reads 5 --use-unpaired --read-qual-trim ! --def-stutter-model --max-str-len 250"
  timeout_minutes: 15
inputs:
  type: "illumina-bam-hg38-y"
  fixture: "illumina_slices/HG002.ystr.bam"
  regions:
    repo: "https://github.com/Tfronta/strhub-verified"
    ref: "test/owner-bed"
    path: "test/fixtures/owner-regions-outofpanel.bed"
outputs:
  - path: result.vcf.gz
    format: vcf
    min_records: 1
    content:
      locus_column: 2
      dna_column: 3
      min_distinct_loci: 1
