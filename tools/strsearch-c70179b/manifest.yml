  fixture:
    repo: "https://github.com/AnJingwd/STRsearch"
    ref: c70179b3b175adc82a7314409af06900b3861d61
    path: example/test_data/test.bam
  regions:
    path: "tools/strsearch-c70179b/assets/regions.bed"
    provided_by: author
outputs:
- path: sample_genotypes.txt
  format: tsv
  min_records: 1
  content:
