# STRhub Verified manifest — generated from a self-service submission.
# Verification metadata only; STRhub stores no tool source code. The
# Dockerfile clones the author's PUBLIC repo at the pinned ref at build time.

tool:
  name: STRsearch
  version: c70179b
  maintainer: AnJingwd
  contact: "https://github.com/AnJingwd/STRsearch/issues"
source:
  repo: "https://github.com/AnJingwd/STRsearch"
  ref: c70179b3b175adc82a7314409af06900b3861d61
submission:
  by: third_party
# Written by STRhub, not read off the repository: a note under the documented
# result, never the badge. Each workaround is a departure from the README a
# first-time user would have to discover (docs/PLAN-Documented-Is-The-Badge.md).
recipe:
  origin: curated
  workarounds:
    - what: "Builds the environment on ubuntu 22.04 at the version floors the README declares (bwa, samtools, bamToFastq, seqtk)."
      instead_of: "The repository's own Dockerfile: ubuntu 16.04 with exact pins and Miniconda 4.3.31."
      why: "The pinned stack no longer resolves."
    - what: "Fills in conf.py with the paths of the installed tools."
      instead_of: "conf.py as shipped, with 'YOUR PATH/...' placeholders the user is to replace."
    - what: "Leaves usearch out."
      instead_of: "usearch, which conf.py names."
      why: "Licensed and unobtainable; only --assemble_pairs reaches it, and this run does not use it."
    - what: "Supplies an hg38 regions configuration in STRsearch's eleven-column layout, with flanking sequences, written by STRhub."
      instead_of: "The repository's example, which is hg19 and covers five markers."
      why: "No hg38 configuration ships with the repository."
report:
  slug: "strsearch"
environment:
  dockerfile: Dockerfile
  os: ["ubuntu-22.04"]
  source: submitted
run:
  cmd: "python3 /opt/STRsearch/pipeline.py --type paired --num_processors 4 --reads_threshold 30 --stutter_ratio 0.5 from_bam --working_path /data/out --sample sample --sex female --bam /data/in/input.bam --ref_bed /data/in/regions.bed --genotypes /data/out/genotypes.txt --multiple_alleles /data/out/multiple_alleles.txt --qc_matrix /data/out/qc_matrix.txt"
  timeout_minutes: 20
inputs:
  type: "illumina-bam-hg38"
  regions:
    library: strsearch   # STRhub's ready-made file; byte-identical to the assets/regions.bed it replaces
outputs:
- path: multiple_alleles.txt
  format: tsv
  min_records: 1
  content:
    columns: 6
    count_columns: [5]
    locus_column: 2
    min_distinct_loci: 8
    expect_loci: [TH01, TPOX, CSF1PO, D5S818, D13S317, D16S539, D7S820, D8S1179]
