# STRhub Verified recipe, PROPOSED from the repository by detect_recipe.
# Nobody typed this: every choice is listed under `caveats`, and the report
# says so. It is published only if the run's verdict is attributable to the
# tool (runs or fails); a verdict that is STRhub's limitation never is.
tool:
  name: ExpansionHunter
  version: v5.0.0
  contact: https://github.com/Illumina/ExpansionHunter/issues
submission:
  by: third_party
source:
  repo: https://github.com/Illumina/ExpansionHunter
  ref: 9f5db1d4ab72016b2d93330b9792842d71582622
recipe:
  origin: proposed
report:
  slug: expansionhunter-med
environment:
  dockerfile: Dockerfile
  os:
  - ubuntu-22.04
  source: generated
run:
  cmd: cd '/opt/tool' && touch /tmp/.strhub_mark && ( mkdir -p sample && ExpansionHunter --reads /data/in/input.bam --reference /data/ref/hg38.fa --variant-catalog /data/in/regions.json --output-prefix sample ); rc=$?; find . -xdev -type f -newer /tmp/.strhub_mark -size +0 ! -path './.git/*' ! -path './proc/*' ! -path './sys/*' ! -path './dev/*' ! -path './data/*' 2>/dev/null | head -500 | while IFS= read -r f; do mkdir -p "/data/out/$(dirname "$f")" && cp "$f" "/data/out/$f"; done; exit $rc
  timeout_minutes: 20
inputs:
  type: illumina-bam-hg38-med
  regions:
    library: eh_catalog
outputs:
- path: '**/*.vcf*'
  format: vcf
  min_records: 1
caveats:
  source: detect_recipe
  items:
  - 'Environment: generated by STRhub from the repository''s install instructions (release_binary), at the pinned commit.'
  - 'Input: the README documents BAM (line 15); this run used STRhub''s illumina-bam-hg38-med reference data.'
  - 'Panel: the loci file the documented command reads, shipped in the repository, lists coordinates inside STRhub''s medical STR slice and none inside the forensic one; this run used the medical slice of the same sample (illumina-bam-hg38-med).'
  - The output directory the command writes into (sample) was created first.
  - 1 input path(s) in the README command replaced with /data/in/input.bam.
  - 1 reference FASTA path(s) replaced with /data/ref/hg38.fa.
  - 'Run command: the one documented in docs/03_Usage.md (line 15), rewritten to STRhub''s mounts; everything it created was captured as output.'
  - 'Regions: STRhub''s ready-made eh_catalog file for the dataset''s panel loci (STRhub records the eh_catalog layout for a program of this name).'
