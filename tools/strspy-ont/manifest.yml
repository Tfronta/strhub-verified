# STRhub Verified recipe, PROPOSED from the repository by detect_recipe.
# Nobody typed this: every choice is listed under `caveats`, and the report
# says so. It is published only if the run's verdict is attributable to the
# tool (runs or fails); a verdict that is STRhub's limitation never is.
tool:
  name: STRspy
  version: v2.0
  contact: https://github.com/unique379r/strspy/issues
submission:
  by: third_party
source:
  repo: https://github.com/unique379r/strspy
  ref: dafdee7e7e5672c8dc732e8577dbe153f53a12f5
recipe:
  origin: proposed
report:
  slug: strspy-ont
environment:
  dockerfile: Dockerfile
  os:
  - ubuntu-22.04
  source: generated
run:
  cmd: cd '/opt/tool' && touch /tmp/.strhub_mark && ( bash ./STRspy_run_v2.0_Args.sh config/InputConfig.txt config/ToolsConfig.txt ); rc=$?; find . -xdev -type f -newer /tmp/.strhub_mark -size +0 ! -path './.git/*' ! -path './proc/*' ! -path './sys/*' ! -path './dev/*' ! -path './data/*' 2>/dev/null | head -500 | while IFS= read -r f; do mkdir -p "/data/out/$(dirname "$f")" && cp "$f" "/data/out/$f"; done; exit $rc
  timeout_minutes: 20
inputs:
  type: ont-bam-hg38
outputs:
- path: '**/*.t[sx][vt]'
  format: tsv
  min_records: 1
caveats:
  source: detect_recipe
  items:
  - 'Environment: generated by STRhub from the repository''s setup/STRspy_2.0_env.yml (conda), at the pinned commit.'
  - 'Input: the README documents BAM and FASTQ (line 44); this run used STRhub''s ont-bam-hg38 reference data. The author recommends BAM (line 295: "Tip: Its good practice to use pre-aligned bams for quicker outcomes.").'
  - 'Run command: the README''s own command, rewritten to STRhub''s mounts; everything it created was captured as output.'
