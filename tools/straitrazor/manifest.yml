# STRhub Verified recipe, PROPOSED from the repository by detect_recipe.
# Nobody typed this: every choice is listed under `caveats`, and the report
# says so. It is published only if the run's verdict is attributable to the
# tool (runs or fails); a verdict that is STRhub's limitation never is.
tool:
  name: straitrazor
  version: v3
  contact: https://github.com/Ahhgust/STRaitRazor/issues
submission:
  by: third_party
source:
  repo: https://github.com/Ahhgust/STRaitRazor
  ref: b618e9345ab40f348b504083ae8de2b39abb60fa
recipe:
  origin: proposed
report:
  slug: straitrazor
environment:
  dockerfile: Dockerfile
  os:
  - ubuntu-22.04
  source: generated
run:
  cmd: cd '/opt/tool' && touch /tmp/.strhub_mark && ( str8rzr -c ForenSeqv1.27.config /data/in/sample.fastq > allsequences.txt ); rc=$?; find . -type f -newer /tmp/.strhub_mark -size +0 ! -path './.git/*' 2>/dev/null | head -500 | while IFS= read -r f; do mkdir -p "/data/out/$(dirname "$f")" && cp "$f" "/data/out/$f"; done; exit $rc
  timeout_minutes: 20
inputs:
  type: illumina-str-fastq
outputs:
- path: '**/*.t[sx][vt]'
  format: tsv
  min_records: 1
caveats:
  source: detect_recipe
  items:
  - 'Environment: generated by STRhub from the repository''s Makefile (make), at the pinned commit.'
  - 'Input: the README documents FASTQ (line 19); this run used STRhub''s illumina-str-fastq reference data.'
  - '''str8rzr'' config placeholder resolved to ForenSeqv1.27.config (matches the dataset''s ForenSeq kit).'
  - 1 input placeholder(s) in the README command replaced with /data/in/sample.fastq.
  - 'Run command: the README''s own command, rewritten to STRhub''s mounts; everything it created was captured as output.'
