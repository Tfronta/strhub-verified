# STRhub Verified recipe, PROPOSED from the repository by detect_recipe.
# Nobody typed this: every choice is listed under `caveats`, and the report
# says so. It is published only if the run's verdict is attributable to the
# tool (runs or fails); a verdict that is STRhub's limitation never is.
tool:
  name: TRGT
  version: v5.1.0
  contact: https://github.com/PacificBiosciences/trgt/issues
submission:
  by: third_party
source:
  repo: https://github.com/PacificBiosciences/trgt
  ref: b21c6217eeaef9a080205932fe29f730dc00e31f
recipe:
  origin: proposed
report:
  slug: trgt-hifi-med
environment:
  dockerfile: Dockerfile
  os:
  - ubuntu-22.04
  source: generated
run:
  cmd: cd '/opt/tool' && touch /tmp/.strhub_mark && ( mkdir -p sample && trgt genotype --genome /data/ref/hg38.fa --repeats /data/in/regions.bed --reads /data/in/input.bam --output-prefix sample ); rc=$?; find . -xdev -type f -newer /tmp/.strhub_mark -size +0 ! -path './.git/*' ! -path './proc/*' ! -path './sys/*' ! -path './dev/*' ! -path './data/*' 2>/dev/null | head -500 | while IFS= read -r f; do mkdir -p "/data/out/$(dirname "$f")" && cp "$f" "/data/out/$f"; done; exit $rc
  timeout_minutes: 20
inputs:
  type: pacbio-hifi-bam-hg38-med
  regions:
    library: trgt
outputs:
- path: '**/*.vcf*'
  format: vcf
  min_records: 1
example:
  cmd: trgt genotype --genome example/reference.fasta --repeats example/repeat.bed --reads example/sample.bam --output-prefix sample
  cwd: /opt/tool
  source: detected
caveats:
  source: detect_recipe
  items:
  - 'Environment: generated by STRhub from the repository''s install instructions (release_binary), at the pinned commit.'
  - 'Input: the README documents BAM (line 9); this run used STRhub''s pacbio-hifi-bam-hg38-med reference data.'
  - 'Panel: the loci file the documented command reads, shipped in the repository, lists coordinates inside STRhub''s medical STR slice and none inside the forensic one; this run used the medical slice of the same sample (pacbio-hifi-bam-hg38-med).'
  - '''./trgt'' run as ''trgt'' from the PATH: the build puts it there, not in the directory the documentation runs it from.'
  - The output directory the command writes into (sample) was created first.
  - 1 input path(s) in the README command replaced with /data/in/input.bam.
  - 1 reference FASTA path(s) replaced with /data/ref/hg38.fa.
  - 1 BED path(s) replaced with /data/in/regions.bed.
